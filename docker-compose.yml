services:
  jetson-friend:
    image: jetson-friend:local
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    env_file:
      - config.env
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    volumes:
      - ./models:/app/models
      - ./src:/app/src:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR}/pulse:${XDG_RUNTIME_DIR}/pulse
      - /dev:/dev
    devices:
      - /dev/snd
    stdin_open: true
    tty: true
